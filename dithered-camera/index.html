<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Cursor Guatemala Cowork</title>
    <link rel="stylesheet" href="styles.css?v=5" />
  </head>
  <body>
    <video id="camera" class="camera" playsinline muted autoplay></video>
    <canvas id="dither" class="dither" aria-hidden="true"></canvas>

    <main class="greeting">
      <img
        class="logo"
        src="assets/cursor-logo.png"
        alt="Cursor"
        width="160"
        height="160"
      />
      <h1 class="brand">CURSOR</h1>
      <p class="subtitle">Guatemala Cowork</p>
    </main>

    <p class="hint" id="hint">Click to enable camera</p>

    <script src="script.js"></script>
  </body>
</html>
